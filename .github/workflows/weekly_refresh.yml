name: AltChart weekly refresh

on:
  schedule:
    - cron: "17 12 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altchart-weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mlops.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mlops.txt

      - name: Train and forecast
        run: python refresh.py

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ reports/ models/

          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh AltChart weekly forecast"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
