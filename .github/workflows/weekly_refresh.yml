name: AltChart weekly refresh

on:
  schedule:
    # Every Thursday at 09:17 in Sao Paulo (12:17 UTC)
    - cron: "17 12 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mlops.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-mlops.txt

      - name: Update chart data, evaluate models and forecast direction
        run: python refresh.py

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ models/
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
          else
            git commit -m "chore: refresh AltChart weekly forecast"
            git push
          fi
